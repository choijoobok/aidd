name: AIDD Kit 정합성 검사

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aidd-kit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Kit 명세·배포 경계·회귀 검사
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Node.js 구문 검사
        run: |
          node --check .ai/tools/aidd.mjs
          node --check .ai/tools/aidd_hook.mjs
          node --check .aidd-kit-dev/tools/kit.mjs

      - name: 원본 provider 스킬 동기화
        run: node .aidd-kit-dev/tools/kit.mjs sync-providers

      - name: 생성 결과 드리프트 검사
        run: git diff --exit-code

      - name: Kit와 export 경계 검증
        run: node .aidd-kit-dev/tools/kit.mjs validate

      - name: Kit 생명주기 테스트
        run: node --test .aidd-kit-dev/tests/*.test.mjs

      - name: AIDD 프레임워크 회귀 테스트
        run: node --test .ai/tests/*.test.mjs
