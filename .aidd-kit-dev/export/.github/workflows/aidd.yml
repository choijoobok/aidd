name: AIDD 정합성 검사

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aidd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 정본·문서·스킬·테스트 검증
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Node.js 구문 검사
        run: |
          node --check .ai/tools/aidd.mjs
          node --check .ai/tools/aidd_hook.mjs

      - name: 파생 문서와 AI 어댑터 재생성
        run: |
          node .ai/tools/aidd.mjs generate
          node .ai/tools/aidd.mjs sync-ai

      - name: 생성 결과 드리프트 검사
        run: git diff --exit-code

      - name: 정본 정합성 검사
        run: node .ai/tools/aidd.mjs validate

      - name: Git 신원 대조
        run: node .ai/tools/aidd.mjs identity-check --warning-only

      - name: 프레임워크 테스트
        run: node --test .ai/tests/*.test.mjs
