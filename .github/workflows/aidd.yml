name: AIDD Kit 정합성 검사

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aidd-kit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Kit 명세·배포 경계·회귀 검사
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python 구문 검사
        run: python -m py_compile .ai/tools/aidd.py .ai/tools/aidd_hook.py .aidd-kit-dev/tools/kit.py

      - name: 원본 provider 스킬 동기화
        run: python .aidd-kit-dev/tools/kit.py sync-providers

      - name: 생성 결과 드리프트 검사
        run: git diff --exit-code

      - name: Kit와 export 경계 검증
        run: python .aidd-kit-dev/tools/kit.py validate

      - name: Kit 생명주기 테스트
        run: python -m unittest discover -s .aidd-kit-dev/tests -v

      - name: AIDD 프레임워크 회귀 테스트
        run: python -m unittest discover -s .ai/tests -v
